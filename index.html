<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>课表与作业管理 | 课程任务助手</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2b4f8c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="课程任务桌">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-container">
    <div class="header-bar">
        <div class="title-section">
            <h1>📖 课程任务桌</h1>
            <h2>课表展示 · 添加课上作业 · 完成打勾 ✔️</h2>
        </div>
        <div class="actions">
            <div class="btn-group">
                <label for="bgInput" class="bg-input-label" title="更改背景">🖼️ 背景</label>
                <input type="file" id="bgInput" accept="image/*">
                <button id="resetBgBtn" class="bg-input-label" title="还原默认背景" style="padding: 10px 15px;">⟳ 还原</button>
                
                <label for="docInput" class="bg-input-label" title="导入文档">� 文档</label>
                <input type="file" id="docInput" accept=".doc,.docx,.txt,.pdf">
            </div>

            <div class="btn-group">
                <button id="exportBtn" class="btn-outline" title="导出备份">📤 导出</button>
                <button id="importBtn" class="btn-outline" title="导入备份">📥 导入</button>
                <input type="file" id="importFile" accept=".json" style="display:none">
                <button id="textImportBtn" class="btn-outline" title="粘贴文字快速导入课表">📝 文字导入</button>
            </div>

            <button id="resetDataBtn" class="btn-outline">⟳ 重置</button>
            <button id="clearAllCoursesBtn" class="btn-outline">🗑 清空课程</button>
            <button id="clearAllJobsBtn" class="btn-outline">🗑 清空作业</button>
        </div>
    </div>

    <div class="timetable-wrapper">
        <table class="timetable" id="timetableGrid">
            <thead id="tableHeader"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <div class="footer-note">
        💡 提示：双击课程格子可编辑课程名称与地点（清空名称=删除课程并移除相关作业）<br>
        📌 每个课程右侧“作业”按钮可查看/添加/完成该课作业，作业支持打勾标记完成和删除。<br>
        💻 <b>像应用一样使用</b>：在浏览器地址栏右侧点击“安装”图标，或在菜单中选择“安装 课程任务桌”，即可将其添加到桌面。
    </div>
</div>

<div class="modal-overlay" id="jobsModal">
    <div class="modal-container">
        <div class="modal-header">
            <h3 id="modalTitle">📝 课程作业</h3>
            <button class="close-modal" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <ul class="job-list" id="jobList"></ul>
            <div class="trash-zone" id="trashZone">
                <span class="trash-icon">🗑️</span>
                <span>拖到这里删除</span>
                <span class="trash-count" id="trashCount">0</span>
            </div>
            <div class="add-job-area">
                <input type="text" id="jobInput" placeholder="添加新作业...">
                <button class="small-btn" onclick="addJob()">添加</button>
            </div>
            <p class="tip-text">💡 拖动作业到垃圾桶可删除</p>
        </div>
    </div>
</div>

<div class="modal-overlay" id="textImportModal">
    <div class="modal-container" style="max-width: 600px;">
        <div class="modal-header">
            <h3>📝 文字导入课表</h3>
            <button class="close-modal" onclick="closeTextImportModal()">&times;</button>
        </div>
        <div class="modal-body">
            <textarea id="textImportArea" style="width: 100%; min-height: 200px; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 12px; padding: 12px; color: white; font-size: 0.85rem; resize: vertical; outline: none;" placeholder="粘贴课表文字，格式示例：

周一 第1-2节 高等数学 教室A101
周一 第3-4节 大学英语 教室B202
周二 第1-2节 计算机基础 机房C301

也支持：周一 1-2节 或周一 1、2节 或 一 1-2节"></textarea>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px;">
                <button class="btn-secondary" onclick="closeTextImportModal()">取消</button>
                <button class="small-btn" onclick="importTextSchedule()">导入</button>
            </div>
            <p class="tip-text" style="margin-top: 16px;">💡 支持常见课表格式，自动识别星期、节数、课程名和教室</p>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
